name: ci

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # CI gates the portable build (stub Xen path, auto-detected by the
      # Makefile when no libxl/xenlight pkg-config module is present). The
      # real xenlight cgo binding is intentionally NOT compiled here: the
      # pinned xenlight Go module tracks xen master, which is newer than the
      # runner image's libxl, so the cgo path only compile-verifies on the
      # deployment target (the dom0, where `make build` picks up the tag via
      # pkg-config automatically once the Xen dev packages are in the image).
      # GUI build requires OpenGL/Wayland/X11 dev headers (Fyne cgo).
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libwayland-dev \
            libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxxf86vm-dev libx11-dev
      - name: make build
        run: make build
      - name: go test
        run: make test
      - name: golangci-lint
        run: make lint
