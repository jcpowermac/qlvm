name: ci

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # libxl headers so the real xenlight cgo binding compiles
      # (Makefile auto-detects via pkg-config --exists libxl).
      - name: Install libxl headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxl-dev
      - name: make build
        run: make build
      - name: go test
        run: make test
      - name: golangci-lint
        run: make lint
